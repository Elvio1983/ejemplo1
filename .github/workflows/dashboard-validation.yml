name: Dashboard validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/design-dashboard-for-web-programming-course
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML and dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check HTML structure
        run: npm run check:html
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Test dashboard with offline fixtures
        run: npm test
